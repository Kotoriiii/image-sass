<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#E5E5E5;stop-opacity:0.7" />
    </linearGradient>

  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGradient)" />
  
  <!-- Main Icon -->
  <g transform="translate(4, 4)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="24" height="24" rx="6" fill="none" stroke="url(#iconGradient)" stroke-width="1.5" />
    
    <!-- Inner image area -->
    <rect x="3" y="3" width="18" height="12" rx="3" fill="url(#iconGradient)" fill-opacity="0.2" />
    
    <!-- Mountain landscape -->
    <path d="M3 12 L8 8 L13 10 L18 6 L21 8 L21 15 L3 15 Z" fill="url(#iconGradient)" fill-opacity="0.6" />
    
    <!-- Sun -->
     <circle cx="18" cy="7" r="2" fill="#FFFFFF" fill-opacity="0.8" />
    
    <!-- Processing dots -->
    <g transform="translate(6, 18)">
      <circle cx="0" cy="1" r="1" fill="#FFFFFF">
         <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0s" />
       </circle>
       <circle cx="4" cy="1" r="1" fill="#FFFFFF">
         <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.3s" />
       </circle>
       <circle cx="8" cy="1" r="1" fill="#FFFFFF">
         <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.6s" />
       </circle>
       <circle cx="12" cy="1" r="1" fill="#FFFFFF">
         <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.9s" />
       </circle>
    </g>
  </g>
</svg>