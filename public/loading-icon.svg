<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring -->
  <circle cx="20" cy="20" r="18" stroke="#CCCCCC" stroke-width="4" fill="none"/>
  
  <!-- Animated progress ring -->
  <circle cx="20" cy="20" r="18" stroke="#000000" stroke-width="4" fill="none" 
          stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="85">
    <animateTransform attributeName="transform" type="rotate" 
                      values="0 20 20;360 20 20" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner image processing icon -->
  <rect x="12" y="14" width="16" height="12" rx="2" fill="#F0F0F0"/>
  <path d="M13 23L15.5 20L18 22L22 17L25 20V24H13V23Z" fill="#888888">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </path>
  <circle cx="22" cy="18" r="1.5" fill="#CCCCCC">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Processing dots -->
  <circle cx="8" cy="20" r="1.5" fill="#333333">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="20" r="1.5" fill="#333333">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="8" r="1.5" fill="#333333">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="32" r="1.5" fill="#333333">
    <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
</svg>